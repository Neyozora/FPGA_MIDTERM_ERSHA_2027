# =============================================================================
# OpenOCD Configuration for Terasic DE10-Standard (Cyclone V SX SoC)
# Scan Chain:
#   @1: 4BA00477  SOCVHPS (Dual-Core ARM Cortex-A9)
#   @2: 02D020DD  5CSXFC6D6F31C6 (Cyclone V FPGA Fabric)
# =============================================================================

adapter driver usb_blaster
# For USB-Blaster II on DE10-Standard:
usb_blaster vid_pid 0x09fb 0x6010 0x09fb 0x6810
adapter speed 6000

# 1. Declare FPGA TAP first on scan chain (2-device JTAG chain)
jtag newtap cyclonev fpga -irlen 10 -expected-id 0x02d020dd

# 2. Declare HPS ARM DAP TAP
jtag newtap cyclonev cpu -irlen 4 -expected-id 0x4ba00477

# 3. Create DAP & Cortex-A9 Target 0 (Core 0)
dap create cyclonev.dap -chain-position cyclonev.cpu
target create cyclonev.cpu0 cortex_a -dap cyclonev.dap -coreid 0 -dbgbase 0x80110000

# Usage (load bare-metal ELF into 64 KB On-Chip RAM @ 0xFFFF0000 without SD card):
#   openocd -f openocd_de10_standard.cfg -c "init; halt; load_image hps_cnn.elf; resume 0xFFFF0000; exit"
